name: personal-fitness-planner

services:
  mysql:
    image: mysql:8.4
    profiles: ["bundled-db"]
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: fitness
      MYSQL_USER: ${MYSQL_USER:-fitness}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - backend

  backend:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_BACKEND: ${DATABASE_BACKEND:-sqlite}
      SQLITE_DATABASE_PATH: /app-data/fitness.db
      DATABASE_URL: ${DATABASE_URL:-}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: fitness
      MYSQL_USER: ${MYSQL_USER:-fitness}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      RUNTIME_CONFIG_PATH: /app-data/backend-config.json
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-127.0.0.1,::1}"
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost","http://127.0.0.1"]}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SQL_ECHO: ${SQL_ECHO:-false}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-2097152}
      LOGIN_ATTEMPTS_PER_MINUTE: ${LOGIN_ATTEMPTS_PER_MINUTE:-10}
      SYNC_RETENTION_DAYS: ${SYNC_RETENTION_DAYS:-90}
      DATABASE_WAIT_SECONDS: ${DATABASE_WAIT_SECONDS:-120}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
      RUN_SEED: ${RUN_SEED:-1}
    volumes:
      - backend_config:/app-data
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - backend

  backup:
    image: mysql:8.4
    profiles: ["tools"]
    environment:
      MYSQL_PWD: ${MYSQL_PASSWORD:-}
    volumes:
      - ./backups:/backups
    networks:
      - backend
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ["mysqldump"]
    command: ["-h", "mysql", "-u", "${MYSQL_USER:-fitness}", "--single-transaction", "--no-tablespaces", "--routines", "--events", "--set-gtid-purged=OFF", "fitness"]

volumes:
  mysql_data:
  backend_config:

networks:
  backend:
    internal: false
