[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "personal-fitness-planner-backend"
version = "0.1.0"
description = "FastAPI and MySQL backend for Personal Fitness Planner"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=23.1,<26",
  "email-validator>=2.2,<3",
  "fastapi>=0.116,<1",
  "gunicorn>=23,<26",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "PyJWT>=2.10,<3",
  "PyMySQL>=1.1,<2",
  "PyYAML>=6,<7",
  "python-multipart>=0.0.20,<1",
  "SQLAlchemy>=2.0.41,<3",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.0",
  "pip-audit==2.10.1",
  "pip-tools>=7.5,<8",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<7",
  "ruff==0.16.2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers -p no:cacheprovider"
testpaths = ["tests"]
markers = [
  "mysql: requires a real MySQL 8 database",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Start with correctness checks that catch syntax errors and invalid/unused
# names. Broader style families (I, UP, B, DTZ, and others) will be enabled
# incrementally as the integrated backend's historical lint debt is cleared.
select = ["E9", "F"]
