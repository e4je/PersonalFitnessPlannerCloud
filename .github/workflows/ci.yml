name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON Schema and cross-contract invariants
        shell: pwsh
        run: ./scripts/validate-contracts.ps1 -Python python
      - name: Reject committed secrets and known development credentials
        run: python scripts/scan-secrets.py

  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: fitness_test
          MYSQL_USER: fitness
          MYSQL_PASSWORD: ci-fitness-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot --password=ci-root-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      ENVIRONMENT: test
      JWT_SECRET: ci-only-jwt-secret-that-is-longer-than-32-characters
      TEST_DATABASE_URL: mysql+pymysql://fitness:ci-fitness-password@127.0.0.1:3306/fitness_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml
      - name: Install backend development dependencies
        run: python -m pip install -e "./services/backend[dev]" ruff mypy
      - name: Lint and gradual type gate
        run: |
          ruff check services/backend/app services/backend/scripts services/backend/tests
          mypy --ignore-missing-imports --follow-imports=skip services/backend/app/schemas services/backend/app/core/config.py
      - name: Fast tests
        working-directory: services/backend
        run: python -m pytest -m "not mysql"
      - name: MySQL migration and seed tests
        working-directory: services/backend
        run: python -m pytest -m mysql
      - name: Verify runtime OpenAPI snapshot
        working-directory: services/backend
        run: python -m scripts.export_openapi
      - name: Verify no OpenAPI drift
        run: |
          cmp services/backend/contracts/openapi.yaml contracts/openapi.yaml
          git diff --exit-code -- services/backend/contracts/openapi.yaml contracts/openapi.yaml

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        working-directory: apps/android
        run: ./gradlew test --stacktrace
      - name: Lint
        working-directory: apps/android
        run: ./gradlew lint --max-workers=1 --stacktrace
      - name: Assemble debug
        working-directory: apps/android
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-debug-and-reports
          path: |
            apps/android/app/build/outputs/apk/debug/*.apk
            apps/android/app/build/reports/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore apps/windows/PersonalFitnessPlanner.sln
      - name: Build
        run: dotnet build apps/windows/PersonalFitnessPlanner.sln -c Release --no-restore
      - name: Test
        run: dotnet test apps/windows/PersonalFitnessPlanner.sln -c Release --no-build
      - name: Publish and smoke test
        shell: pwsh
        run: ./apps/windows/scripts/publish.ps1 -SkipTests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-publish-and-results
          path: |
            apps/windows/artifacts/
            apps/windows/TestResults/
