openapi: 3.1.0
info:
  title: Personal Fitness Planner API
  summary: Cloud API for synchronized personal training plans and workout records
  description: Server-authoritative exercise catalog and immutable training plan versions, with offline-friendly idempotent
    workout synchronization.
  version: 1.0.0
